<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Гранд Лайн Серф | Макс Летов &amp; ShiYori</title>
  <link rel="canonical" href="https://letovshiyori.org/game.html">
  <meta name="description" content="Мини-игра «Гранд Лайн»: собирай Белли и уворачивайся от опасностей.">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/10851/10851067.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Rye&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Rye&display=swap" rel="stylesheet"></noscript>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050a0f;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.55);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      transition: transform 0.06s ease-out;
    }

    #start-menu {
      position: absolute;
      inset: 0;
      background: rgba(5, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      text-align: center;
      color: #fff;
      padding: 20px;
    }

    #start-menu h1 {
      font-family: 'Rye', serif;
      font-size: 56px;
      color: #ffb86b;
      margin: 0 0 10px 0;
      text-shadow: 0 5px 24px rgba(255, 184, 107, 0.45);
      letter-spacing: 2px;
    }

    #start-menu p {
      font-size: 17px;
      color: #cbd5e1;
      margin: 0 0 14px 0;
      font-weight: 600;
    }

    .best-bounty-pill {
      background: rgba(255, 184, 107, 0.12);
      border: 1px solid rgba(255, 184, 107, 0.35);
      color: #ffb86b;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .diff-row {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .diff-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 15px 28px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s, color 0.25s, box-shadow 0.25s;
      width: 200px;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .diff-btn:hover { transform: translateY(-5px); }
    .diff-btn.easy { border-color: #38bdf8; color: #38bdf8; }
    .diff-btn.easy:hover { background: #38bdf8; color: #0f172a; box-shadow: 0 10px 24px rgba(56, 189, 248, 0.35); }
    .diff-btn.medium { border-color: #ffb86b; color: #ffb86b; }
    .diff-btn.medium:hover { background: #ffb86b; color: #1a1a1a; box-shadow: 0 10px 24px rgba(255, 184, 107, 0.35); }
    .diff-btn.hard { border-color: #ef4444; color: #ef4444; }
    .diff-btn.hard:hover { background: #ef4444; color: #fff; box-shadow: 0 10px 24px rgba(239, 68, 68, 0.35); }

    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    .score-board {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.45);
      padding: 12px 24px;
      border-radius: 14px;
      border: 1px solid rgba(255, 184, 107, 0.35);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.5s ease;
    }

    #score {
      color: #ffb86b;
      font-size: 26px;
      display: block;
      margin-top: 4px;
      text-shadow: 0 0 10px rgba(255, 184, 107, 0.5);
    }

    #mugiwara-popup {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px) scale(0.9);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(240, 240, 240, 0.96));
      padding: 14px 24px;
      border-radius: 20px;
      color: #1a1a1a;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 3px solid #ffb86b;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: none;
      max-width: 90vw;
    }

    #mugiwara-popup.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #mugiwara-avatar {
      font-size: 34px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
    }

    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e8d5a5;
      padding: 36px 28px;
      border-radius: 6px;
      text-align: center;
      color: #3b2818;
      display: none;
      pointer-events: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(139, 69, 19, 0.45);
      border: 3px solid #8b4513;
      width: 320px;
      max-width: calc(100vw - 32px);
    }

    #game-over h1 {
      margin: 0 0 6px 0;
      font-family: 'Rye', serif;
      font-size: 46px;
      letter-spacing: 2px;
      color: #3b2818;
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
    }

    #game-over h2 {
      margin: 0 0 16px 0;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #5a3d22;
    }

    .bounty-amount {
      font-family: 'Rye', serif;
      font-size: 34px;
      margin: 18px 0;
      color: #d03027;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
    }

    .btn {
      background: #d03027;
      color: #fff;
      border: 2px solid #3b2818;
      padding: 12px 24px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 #3b2818;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #3b2818; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #3b2818; }

    .btn.secondary {
      background: transparent;
      color: #6b3410;
      box-shadow: none;
      border-color: transparent;
      padding: 8px;
      font-size: 14px;
    }

    .btn.secondary:hover { transform: none; box-shadow: none; text-decoration: underline; }

    .back-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      transition: background-color 0.2s ease, border-color 0.2s ease;
      z-index: 100;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 600px) {
      #start-menu h1 { font-size: 38px; }
      .diff-btn { width: 100%; }
      .diff-row { flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="start-menu">
    <h1>ГРАНД ЛАЙН</h1>
    <p>Собирай Белли, уворачивайся от водоворотов и Морских Королей.</p>
    <div class="best-bounty-pill">Лучшая награда: B <span id="bestScoreMenu">0</span> -</div>
    <div class="diff-row">
      <button class="diff-btn easy" type="button" data-diff="easy">Ист Блу<br><span style="font-size: 12px; opacity: 0.8; font-weight: 400;">Легко</span></button>
      <button class="diff-btn medium" type="button" data-diff="medium">Гранд Лайн<br><span style="font-size: 12px; opacity: 0.8; font-weight: 400;">Нормально</span></button>
      <button class="diff-btn hard" type="button" data-diff="hard">Новый Мир<br><span style="font-size: 12px; opacity: 0.8; font-weight: 400;">Хардкор</span></button>
    </div>
    <a href="index.html" style="color: #cbd5e1; margin-top: 30px; font-weight: 600; text-decoration: none;">&larr; Вернуться на сайт</a>
  </div>

  <div id="ui-layer">
    <div class="score-board" id="scoreBoard">
      Награда
      <span id="score">0</span>
    </div>

    <a href="index.html" class="back-btn">Выйти</a>

    <div id="mugiwara-popup">
      <div id="mugiwara-avatar">🏴‍☠️</div>
      <div id="mugiwara-text">Вперёд!</div>
    </div>

    <div id="game-over">
      <h1>WANTED</h1>
      <h2>DEAD OR ALIVE</h2>
      <div style="width: 100%; height: 115px; background: #2a1e12; border: 4px solid #3b2818; margin: 10px 0; position: relative; overflow: hidden;">
        <div style="position:absolute; bottom: -28px; left: 50%; transform: translateX(-50%); font-size: 94px;">💀</div>
      </div>
      <div class="bounty-amount">
        <span style="font-family: 'Inter', sans-serif; color:#3b2818; font-size:22px;">B</span>
        <span id="final-score">0</span>
        <span style="font-family: 'Inter', sans-serif; color:#3b2818; font-size:22px;">-</span>
      </div>
      <button class="btn" id="restartBtn" type="button">В море!</button>
      <button class="btn secondary" id="menuBtn" type="button">Сменить сложность</button>
    </div>
  </div>
</div>

<script src="js/pages/game.js"></script>
</body>
</html>
