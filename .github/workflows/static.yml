# Deploy the static site to GitHub Pages after a JavaScript syntax check.
# Every run also refreshes data/*.json (episodes, titles, ...) from Firestore, so visitors
# do not have to read Firestore themselves. See scripts/build-site.mjs.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Refresh the data snapshot. Each run reads every document of the episodes/titles/torrent_packs
  # collections once, so keep the interval in line with the Firestore free quota (50k reads/day).
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -eu
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Run automated tests
        run: npm test

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site and data snapshot
        run: node scripts/build-site.mjs --out _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
